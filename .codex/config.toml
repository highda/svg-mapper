# Repository-local Codex behavior. Codex loads this layer only after this
# project has been trusted; see docs/codex-loop.md for the one-time setup.
#
# This box is an isolated, disposable agentbox: the loop runs with full
# filesystem and network access instead of a scoped permission profile.
# There is no protection against a session rewriting this file, its own
# hooks, or its own prompts. The PreCompact hook and the completion guard
# (autonomous-loop.md / completion-review.md) stay in force, but only
# because the agent follows them, not because the sandbox enforces them.
approval_policy = "never"
sandbox_mode = "danger-full-access"

[features]
hooks = true

# Compaction is an emergency cutoff, never a handoff workflow. The agent's
# Git checkpoint and MEMENTO.md must already make recovery possible.
[[hooks.PreCompact]]
matcher = "^auto$"

[[hooks.PreCompact.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.codex/hooks/precompact.sh"'
timeout = 3
statusMessage = "Stopping before context compaction"

# This server is a pinned local development dependency. Browser navigation is
# constrained separately in .codex/playwright-mcp.json.
[mcp_servers.playwright]
command = "./editor/node_modules/.bin/playwright-mcp"
args = ["--config", ".codex/playwright-mcp.json"]
required = true
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "auto"
